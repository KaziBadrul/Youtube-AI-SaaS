<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Implementation monitor</title><link rel="stylesheet" href="/dashboard.css"><script src="/dashboard.js" defer></script></head>
<body><header><div><small>LOCAL DEVELOPMENT · READ ONLY</small><h1>Implementation monitor</h1></div><strong id="mode" role="status">Connecting…</strong></header>
<main><section aria-labelledby="active-heading"><h2 id="active-heading">Active task</h2><h3 id="task">None</h3><p id="phase"></p><dl id="details"></dl><p id="blocker" role="status"></p></section>
<section><h2>Progress</h2><p id="progress"></p><p id="commit"></p></section>
<div class="logs"><section><h2>Codex <small id="codex-process"></small></h2><pre id="codex">No output yet.</pre></section><section><h2>OpenCode <small id="reviewer-process"></small></h2><pre id="reviewer">No output yet.</pre></section></div>
<section><h2>Latest events</h2><pre id="events"></pre></section>
<section><h2>Tasks and dependencies</h2><div class="table-wrap"><table><thead><tr><th>Task</th><th>Status</th><th>Dependencies</th></tr></thead><tbody id="tasks"></tbody></table></div></section></main>
<footer>Monitoring only. Updates every 2 seconds. <span id="updated"></span></footer></body></html>
