<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>S1 boundary experiment</title><style>body{font:16px system-ui;margin:24px;color:#283618;background:#fefae0}button,textarea,select{font:inherit;padding:10px}button:focus-visible,textarea:focus-visible{outline:3px solid #606c38}#workspace{display:grid;grid-template-columns:160px 1fr 320px;gap:20px;margin-top:36px}textarea{width:90%}aside button{display:block;margin:8px 0}#preview{border:1px solid #79835d;padding:20px}details{margin:12px 0}@media(max-width:800px){#workspace{grid-template-columns:1fr}}</style><h1>S1: representative boundary, fake operations only</h1><section id="composer"><h2>What do you want to make?</h2><label for="idea">Idea or script</label><textarea id="idea"></textarea><details><summary>See more</summary><label for="mode">Use this text as</label><select id="mode"><option value="topic">Idea</option><option value="script">Approved script</option></select><p>English · Default creative settings</p></details><button id="create">Create Video</button></section><div id="workspace"><aside aria-label="Scenes">{% for scene in scenes %}<button data-scene="{{scene.id}}">Scene {{scene.id}}</button>{% endfor %}</aside><section><h2 id="scene-title">Select a scene</h2><div id="preview">Selected-scene private audio</div><audio id="audio" controls></audio><p id="progress" role="status"></p><button id="render">Render</button><button id="cancel">Cancel</button></section><section><button id="narration-tab">Narration</button><button id="visual-tab">Visual</button><label for="words" id="words-label">Scene narration</label><textarea id="words"></textarea><p id="save-state" role="status"></p><button id="regenerate">Regenerate narration</button><p id="lock-state" role="status"></p></section></div><dialog id="scope-dialog" aria-labelledby="scope-title"><h2 id="scope-title">Narration update scope</h2><p id="scope-message"></p><button id="confirm-regenerate">Regenerate narration</button><form method="dialog"><button>Back</button></form></dialog><script src="/boundary.js" defer></script></html>
